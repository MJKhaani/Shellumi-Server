openapi: 3.1.0
info:
  title: Shellumi Server API
  description: Self-hosted, encrypted synchronization server for Shellumi.
  version: 0.1.0
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

paths:
  /health/live:
    get:
      summary: Liveness probe
      description: Returns process liveness status without leaking secrets or system details.
      responses:
        '200':
          description: Service is alive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /health/ready:
    get:
      summary: Readiness probe
      description: Returns system readiness for handling requests.
      responses:
        '200':
          description: Service is ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /api/v1/capabilities:
    get:
      summary: Server capabilities
      description: Advertises supported protocol versions, features, cryptographic suites, and bounds.
      responses:
        '200':
          description: Supported capabilities
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CapabilitiesResponse'

  /api/v1/bootstrap:
    post:
      summary: One-time administrator bootstrap
      description: Consumes the one-time initial bootstrap to create the first organization and administrator.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BootstrapRequest'
      responses:
        '201':
          description: Bootstrap completed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BootstrapResponse'
        '409':
          description: Bootstrap has already been consumed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/auth/login:
    post:
      summary: Authenticate user
      description: Verifies user credentials and optional device identity, returning access and refresh tokens.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authentication successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/auth/refresh:
    post:
      summary: Rotate refresh token
      description: Validates and rotates a refresh token, detecting token reuse and issuing a fresh token pair.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '200':
          description: Token rotated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshTokenResponse'
        '403':
          description: Token reuse detected or token revoked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/auth/logout:
    post:
      summary: User logout
      description: Revokes the specified session or all active sessions for the calling user.
      responses:
        '200':
          description: Session terminated

  /api/v1/me:
    get:
      summary: Current user info
      description: Returns profile and organization memberships of the authenticated user.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: User profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
        '401':
          description: Unauthenticated

  /api/v1/devices:
    get:
      summary: List registered devices
      description: Returns all devices registered to the calling user.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: List of devices
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DeviceResponse'
    post:
      summary: Register a client device
      description: Registers a new device identity with dedicated signing and agreement keys.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterDeviceRequest'
      responses:
        '201':
          description: Device registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceResponse'

  /api/v1/devices/{id}:
    delete:
      summary: Revoke a device
      description: Deauthorizes a device and terminates all its active sessions immediately.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Device revoked

  /api/v1/vaults:
    get:
      summary: List vaults
      description: Returns all vaults accessible to the authenticated user.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: List of vaults
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VaultListResponse'
    post:
      summary: Create a vault
      description: Creates a new encrypted personal or team vault.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateVaultRequest'
      responses:
        '201':
          description: Vault created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VaultResponse'

  /api/v1/vaults/{id}:
    get:
      summary: Get vault details
      description: Fetches metadata for a specific vault.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Vault details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VaultResponse'
        '404':
          description: Vault not found
    patch:
      summary: Update vault metadata
      description: Updates vault encrypted display name or policies.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateVaultRequest'
      responses:
        '200':
          description: Vault updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VaultResponse'
    delete:
      summary: Delete a vault
      description: Soft-deletes a vault (owner only).
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Vault deleted

  /api/v1/vaults/{id}/commits:
    post:
      summary: Commit a batch of mutations
      description: Atomically processes signed conditional mutations with CAS revision checking.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: X-Device-Id
          in: header
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommitBatchRequest'
      responses:
        '200':
          description: Batch successfully applied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommitBatchResponse'
        '403':
          description: Forbidden or invalid device signature
        '409':
          description: CAS revision conflict or idempotency conflict

  /api/v1/vaults/{id}/changes:
    get:
      summary: Get delta changes feed
      description: Paginated feed of encrypted record changes and tombstones in strictly increasing sequence.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: since
          in: query
          required: false
          schema:
            type: integer
        - name: cursor
          in: query
          required: false
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
      responses:
        '200':
          description: Changes feed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangeFeedResponse'

  /api/v1/vaults/{id}/snapshots/{revision}:
    get:
      summary: Get full recovery snapshot
      description: Returns active encrypted records for full resynchronization.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: revision
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Recovery snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SnapshotResponse'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer

  schemas:
    HealthResponse:
      type: object
      required:
        - status
        - service
        - version
      properties:
        status:
          type: string
          example: ok
        service:
          type: string
          example: shellumi-server
        version:
          type: string
          example: 0.1.0
        details:
          type: string
          nullable: true

    CapabilitiesResponse:
      type: object
      required:
        - server_version
        - protocol_version
        - min_protocol_version
        - supported_features
        - supported_e2ee_suites
        - limits
      properties:
        server_version:
          type: string
          example: 0.1.0
        protocol_version:
          type: integer
          example: 1
        min_protocol_version:
          type: integer
          example: 1
        supported_features:
          type: array
          items:
            type: string
        supported_e2ee_suites:
          type: array
          items:
            type: string
        limits:
          $ref: '#/components/schemas/ServerLimits'

    ServerLimits:
      type: object
      required:
        - max_request_bytes
        - max_record_bytes
        - max_mutations_per_commit
      properties:
        max_request_bytes:
          type: integer
        max_record_bytes:
          type: integer
        max_mutations_per_commit:
          type: integer

    BootstrapRequest:
      type: object
      required:
        - admin_username
        - admin_email
        - admin_password
        - org_name
      properties:
        admin_username:
          type: string
        admin_email:
          type: string
        admin_password:
          type: string
        org_name:
          type: string
        bootstrap_token:
          type: string
          nullable: true

    BootstrapResponse:
      type: object
      required:
        - org_id
        - user_id
        - username
        - email
        - access_token
        - refresh_token
        - expires_in_secs
      properties:
        org_id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        username:
          type: string
        email:
          type: string
        access_token:
          type: string
        refresh_token:
          type: string
        expires_in_secs:
          type: integer

    LoginRequest:
      type: object
      required:
        - identifier
        - password
      properties:
        identifier:
          type: string
        password:
          type: string
        device_id:
          type: string
          format: uuid
          nullable: true

    LoginResponse:
      type: object
      required:
        - user_id
        - username
        - email
        - access_token
        - refresh_token
        - expires_in_secs
      properties:
        user_id:
          type: string
          format: uuid
        username:
          type: string
        email:
          type: string
        access_token:
          type: string
        refresh_token:
          type: string
        expires_in_secs:
          type: integer

    RefreshTokenRequest:
      type: object
      required:
        - refresh_token
      properties:
        refresh_token:
          type: string

    RefreshTokenResponse:
      type: object
      required:
        - access_token
        - refresh_token
        - expires_in_secs
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        expires_in_secs:
          type: integer

    RegisterDeviceRequest:
      type: object
      required:
        - device_name
        - signing_public_key
        - agreement_public_key
      properties:
        device_name:
          type: string
        signing_public_key:
          type: string
        agreement_public_key:
          type: string

    DeviceResponse:
      type: object
      required:
        - device_id
        - user_id
        - device_name
        - signing_public_key
        - agreement_public_key
        - created_at
      properties:
        device_id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        device_name:
          type: string
        signing_public_key:
          type: string
        agreement_public_key:
          type: string
        created_at:
          type: integer
        last_seen_at:
          type: integer
          nullable: true
        revoked_at:
          type: integer
          nullable: true

    MeResponse:
      type: object
      required:
        - user_id
        - username
        - email
        - organizations
      properties:
        user_id:
          type: string
          format: uuid
        username:
          type: string
        email:
          type: string
        organizations:
          type: array
          items:
            $ref: '#/components/schemas/UserOrgSummary'

    UserOrgSummary:
      type: object
      required:
        - org_id
        - org_name
        - role
      properties:
        org_id:
          type: string
          format: uuid
        org_name:
          type: string
        role:
          type: string

    ErrorResponse:
      type: object
      required:
        - error_code
        - message
      properties:
        error_code:
          type: string
        message:
          type: string
        request_id:
          type: string
          nullable: true

    EncryptedEnvelope:
      type: object
      required:
        - salt
        - nonce
        - ciphertext
        - associated_data
        - kdf_iterations
      properties:
        salt:
          type: string
          description: Base64-encoded KDF salt (16 bytes)
        nonce:
          type: string
          description: Base64-encoded AEAD nonce (12 bytes)
        ciphertext:
          type: string
          description: Base64-encoded ciphertext with authentication tag
        associated_data:
          type: string
          description: Authenticated associated data (e.g. host:uuid)
        kdf_iterations:
          type: integer
          description: PBKDF2 iteration count

    CreateVaultRequest:
      type: object
      properties:
        name:
          type: string
          nullable: true
        encrypted_name:
          type: string
          nullable: true
        vault_type:
          type: string
          enum: [personal, team]
          default: personal

    UpdateVaultRequest:
      type: object
      properties:
        encrypted_name:
          type: string
          nullable: true

    VaultResponse:
      type: object
      required:
        - vault_id
        - tenant_id
        - owner_id
        - vault_type
        - active_key_epoch
        - server_sequence
        - role
        - created_at
        - updated_at
      properties:
        vault_id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        owner_id:
          type: string
          format: uuid
        vault_type:
          type: string
        encrypted_name:
          type: string
          nullable: true
        active_key_epoch:
          type: integer
        server_sequence:
          type: integer
        role:
          type: string
        created_at:
          type: integer
        updated_at:
          type: integer

    VaultListResponse:
      type: object
      required:
        - vaults
      properties:
        vaults:
          type: array
          items:
            $ref: '#/components/schemas/VaultResponse'

    MutationItem:
      type: object
      required:
        - object_id
        - entity_type
        - expected_revision
        - deleted
        - key_epoch
        - device_counter
        - device_signature
      properties:
        object_id:
          type: string
        entity_type:
          type: string
        expected_revision:
          type: integer
        deleted:
          type: boolean
        key_epoch:
          type: integer
        device_counter:
          type: integer
        encrypted_envelope:
          $ref: '#/components/schemas/EncryptedEnvelope'
          nullable: true
        device_signature:
          type: string

    CommitBatchRequest:
      type: object
      required:
        - protocol_version
        - vault_id
        - idempotency_key
        - mutations
      properties:
        protocol_version:
          type: integer
        vault_id:
          type: string
          format: uuid
        idempotency_key:
          type: string
        base_cursor:
          type: string
          nullable: true
        mutations:
          type: array
          items:
            $ref: '#/components/schemas/MutationItem'

    MutationAck:
      type: object
      required:
        - object_id
        - assigned_revision
        - server_sequence
        - deleted
      properties:
        object_id:
          type: string
        assigned_revision:
          type: integer
        server_sequence:
          type: integer
        deleted:
          type: boolean

    CommitBatchResponse:
      type: object
      required:
        - vault_id
        - commit_sequence
        - next_cursor
        - applied
      properties:
        vault_id:
          type: string
          format: uuid
        commit_sequence:
          type: integer
        next_cursor:
          type: string
        applied:
          type: array
          items:
            $ref: '#/components/schemas/MutationAck'

    SyncChangeItem:
      type: object
      required:
        - sequence
        - object_id
        - entity_type
        - revision
        - deleted
        - author_device_id
        - updated_at
      properties:
        sequence:
          type: integer
        object_id:
          type: string
        entity_type:
          type: string
        revision:
          type: integer
        deleted:
          type: boolean
        author_device_id:
          type: string
          format: uuid
        encrypted_envelope:
          $ref: '#/components/schemas/EncryptedEnvelope'
          nullable: true
        updated_at:
          type: integer

    ChangeFeedResponse:
      type: object
      required:
        - vault_id
        - latest_sequence
        - next_cursor
        - has_more
        - records
      properties:
        vault_id:
          type: string
          format: uuid
        latest_sequence:
          type: integer
        next_cursor:
          type: string
        has_more:
          type: boolean
        records:
          type: array
          items:
            $ref: '#/components/schemas/SyncChangeItem'

    SnapshotResponse:
      type: object
      required:
        - vault_id
        - server_sequence
        - records
      properties:
        vault_id:
          type: string
          format: uuid
        server_sequence:
          type: integer
        records:
          type: array
          items:
            $ref: '#/components/schemas/SyncChangeItem'
