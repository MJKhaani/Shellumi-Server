openapi: 3.1.0
info:
  title: Shellumi Server API
  description: Self-hosted, encrypted synchronization server for Shellumi.
  version: 0.1.0
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

paths:
  /health/live:
    get:
      summary: Liveness probe
      description: Returns process liveness status without leaking secrets or system details.
      responses:
        '200':
          description: Service is alive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /health/ready:
    get:
      summary: Readiness probe
      description: Returns system readiness for handling requests.
      responses:
        '200':
          description: Service is ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /metrics:
    get:
      summary: Prometheus metrics exposition endpoint
      description: Returns internal runtime metrics formatted in Prometheus text format (version 0.0.4). Enabled when metrics_enabled is true.
      responses:
        '200':
          description: Prometheus metrics text exposition
          content:
            text/plain:
              schema:
                type: string
        '404':
          description: Metrics endpoint is disabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/capabilities:
    get:
      summary: Server capabilities
      description: Advertises supported protocol versions, features, cryptographic suites, and bounds.
      responses:
        '200':
          description: Supported capabilities
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CapabilitiesResponse'

  /api/v1/bootstrap:
    post:
      summary: One-time administrator bootstrap
      description: Consumes the one-time initial bootstrap to create the first organization and administrator.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BootstrapRequest'
      responses:
        '201':
          description: Bootstrap completed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BootstrapResponse'
        '409':
          description: Bootstrap has already been consumed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/auth/login:
    post:
      summary: Authenticate user
      description: Verifies user credentials and optional device identity, returning access and refresh tokens.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authentication successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/auth/refresh:
    post:
      summary: Rotate refresh token
      description: Validates and rotates a refresh token, detecting token reuse and issuing a fresh token pair.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '200':
          description: Token rotated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshTokenResponse'
        '403':
          description: Token reuse detected or token revoked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/auth/logout:
    post:
      summary: User logout
      description: Revokes the specified session or all active sessions for the calling user.
      responses:
        '200':
          description: Session terminated

  /api/v1/me:
    get:
      summary: Current user info
      description: Returns profile and organization memberships of the authenticated user.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: User profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
        '401':
          description: Unauthenticated

  /api/v1/devices:
    get:
      summary: List registered devices
      description: Returns all devices registered to the calling user.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: List of devices
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DeviceResponse'
    post:
      summary: Register a client device
      description: Registers a new device identity with dedicated signing and agreement keys.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterDeviceRequest'
      responses:
        '201':
          description: Device registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceResponse'

  /api/v1/devices/{id}:
    delete:
      summary: Revoke a device
      description: Deauthorizes a device and terminates all its active sessions immediately.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Device revoked

  /api/v1/vaults:
    get:
      summary: List vaults
      description: Returns all vaults accessible to the authenticated user.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: List of vaults
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VaultListResponse'
    post:
      summary: Create a vault
      description: Creates a new encrypted personal or team vault.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateVaultRequest'
      responses:
        '201':
          description: Vault created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VaultResponse'

  /api/v1/vaults/{id}:
    get:
      summary: Get vault details
      description: Fetches metadata for a specific vault.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Vault details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VaultResponse'
        '404':
          description: Vault not found
    patch:
      summary: Update vault metadata
      description: Updates vault encrypted display name or policies.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateVaultRequest'
      responses:
        '200':
          description: Vault updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VaultResponse'
    delete:
      summary: Delete a vault
      description: Soft-deletes a vault (owner only).
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Vault deleted

  /api/v1/vaults/{id}/commits:
    post:
      summary: Commit a batch of mutations
      description: Atomically processes signed conditional mutations with CAS revision checking.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: X-Device-Id
          in: header
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommitBatchRequest'
      responses:
        '200':
          description: Batch successfully applied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommitBatchResponse'
        '403':
          description: Forbidden or invalid device signature
        '409':
          description: CAS revision conflict or idempotency conflict

  /api/v1/vaults/{id}/changes:
    get:
      summary: Get delta changes feed
      description: Paginated feed of encrypted record changes and tombstones in strictly increasing sequence.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: since
          in: query
          required: false
          schema:
            type: integer
        - name: cursor
          in: query
          required: false
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
      responses:
        '200':
          description: Changes feed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangeFeedResponse'

  /api/v1/vaults/{id}/snapshots/{revision}:
    get:
      summary: Get full recovery snapshot
      description: Returns active encrypted records for full resynchronization.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: revision
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Recovery snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SnapshotResponse'

  /api/v1/vaults/{id}/members:
    get:
      summary: List vault members
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: List of members
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VaultMemberListResponse'
    post:
      summary: Add or update vault member
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddVaultMemberRequest'
      responses:
        '200':
          description: Member added or updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VaultMemberResponse'

  /api/v1/vaults/{id}/members/{user_id}:
    delete:
      summary: Remove vault member
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: user_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Member removed

  /api/v1/vaults/{id}/invites:
    get:
      summary: List active invitations
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Active invitations
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InviteListResponse'
    post:
      summary: Create scoped invitation
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateInviteRequest'
      responses:
        '201':
          description: Invitation created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InviteResponse'

  /api/v1/vaults/{id}/invites/{invite_id}:
    delete:
      summary: Revoke invitation
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: invite_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Invitation revoked

  /api/v1/invites/accept:
    post:
      summary: Accept invitation
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcceptInviteRequest'
      responses:
        '200':
          description: Invitation accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcceptInviteResponse'

  /api/v1/vaults/{id}/keys/envelopes:
    get:
      summary: Get recipient-wrapped key envelopes for calling device
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: X-Device-Id
          in: header
          required: true
          schema:
            type: string
            format: uuid
        - name: epoch
          in: query
          required: false
          schema:
            type: integer
      responses:
        '200':
          description: Wrapped envelopes for calling device
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KeyEnvelopeListResponse'
    post:
      summary: Publish recipient-wrapped key envelopes
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: X-Device-Id
          in: header
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublishKeyEnvelopesRequest'
      responses:
        '201':
          description: Envelopes stored

  /api/v1/vaults/{id}/keys/epochs:
    post:
      summary: Rotate vault key epoch
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: X-Device-Id
          in: header
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RotateKeyEpochRequest'
      responses:
        '200':
          description: Epoch rotated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RotateKeyEpochResponse'

  /api/v1/vaults/{id}/audit:
    get:
      summary: Fetch cryptographic audit log
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          required: false
          schema:
            type: integer
        - name: offset
          in: query
          required: false
          schema:
            type: integer
      responses:
        '200':
          description: Audit events
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditLogResponse'

  /api/v1/collab/sessions:
    get:
      summary: List active collaboration sessions
      description: Returns active sessions where the user is host or enrolled participant.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Active sessions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollabSessionListResponse'
        '403':
          description: Collaboration disabled or unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      summary: Create live terminal collaboration session
      description: Starts a new live collaboration session in read-only or controllable mode.
      security:
        - BearerAuth: []
      parameters:
        - name: X-Device-Id
          in: header
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCollabSessionRequest'
      responses:
        '201':
          description: Session created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollabSessionResponse'
        '403':
          description: Collaboration feature disabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/collab/sessions/{id}:
    get:
      summary: Get collaboration session details
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Session details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollabSessionResponse'
        '404':
          description: Session not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/collab/sessions/{id}/participants:
    get:
      summary: List session participants
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Participant list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollabParticipantListResponse'
    post:
      summary: Enroll participant into session
      description: Adds an invited user and device as viewer or writer (host only).
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnrollParticipantRequest'
      responses:
        '201':
          description: Participant enrolled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollabParticipantResponse'

  /api/v1/collab/sessions/{id}/control/grant:
    post:
      summary: Grant write control to participant
      description: Advances monotonic lease token and assigns active writer (host only).
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GrantControlRequest'
      responses:
        '200':
          description: Write control granted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollabSessionResponse'

  /api/v1/collab/sessions/{id}/control/revoke:
    post:
      summary: Revoke write control
      description: Immediately resets active writer and advances lease token (host only).
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Write control revoked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollabSessionResponse'

  /api/v1/collab/sessions/{id}/terminate:
    post:
      summary: Emergency terminate session
      description: Immediately closes subscriber channels and shuts down session (host only).
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Session terminated
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string

  /api/v1/collab/sessions/{id}/frames:
    post:
      summary: Submit client-encrypted collaboration frame
      description: Forwards terminal output (host) or input (writer holding active lease token).
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: X-Device-Id
          in: header
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendCollabFrameRequest'
      responses:
        '201':
          description: Frame broadcasted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollabFrame'
        '403':
          description: Unauthorized role or not active writer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Stale lease token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/collab/sessions/{id}/poll:
    get:
      summary: Poll past frames
      description: Cursor-based polling of ordered frames for fallback environments.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: since_sequence
          in: query
          required: false
          schema:
            type: integer
        - name: limit
          in: query
          required: false
          schema:
            type: integer
      responses:
        '200':
          description: Polled frames
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollabPollResponse'

  /api/v1/collab/sessions/{id}/events:
    get:
      summary: Real-time event stream
      description: Server-Sent Events (SSE) stream delivering real-time encrypted frames.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Text event stream
          content:
            text/event-stream:
              schema:
                type: string

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer

  schemas:
    HealthResponse:
      type: object
      required:
        - status
        - service
        - version
      properties:
        status:
          type: string
          example: ok
        service:
          type: string
          example: shellumi-server
        version:
          type: string
          example: 0.1.0
        details:
          type: string
          nullable: true

    CapabilitiesResponse:
      type: object
      required:
        - server_version
        - protocol_version
        - min_protocol_version
        - supported_features
        - supported_e2ee_suites
        - limits
      properties:
        server_version:
          type: string
          example: 0.1.0
        protocol_version:
          type: integer
          example: 1
        min_protocol_version:
          type: integer
          example: 1
        supported_features:
          type: array
          items:
            type: string
        supported_e2ee_suites:
          type: array
          items:
            type: string
        limits:
          $ref: '#/components/schemas/ServerLimits'

    ServerLimits:
      type: object
      required:
        - max_request_bytes
        - max_record_bytes
        - max_mutations_per_commit
      properties:
        max_request_bytes:
          type: integer
        max_record_bytes:
          type: integer
        max_mutations_per_commit:
          type: integer

    BootstrapRequest:
      type: object
      required:
        - admin_username
        - admin_email
        - admin_password
        - org_name
      properties:
        admin_username:
          type: string
        admin_email:
          type: string
        admin_password:
          type: string
        org_name:
          type: string
        bootstrap_token:
          type: string
          nullable: true

    BootstrapResponse:
      type: object
      required:
        - org_id
        - user_id
        - username
        - email
        - access_token
        - refresh_token
        - expires_in_secs
      properties:
        org_id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        username:
          type: string
        email:
          type: string
        access_token:
          type: string
        refresh_token:
          type: string
        expires_in_secs:
          type: integer

    LoginRequest:
      type: object
      required:
        - identifier
        - password
      properties:
        identifier:
          type: string
        password:
          type: string
        device_id:
          type: string
          format: uuid
          nullable: true

    LoginResponse:
      type: object
      required:
        - user_id
        - username
        - email
        - access_token
        - refresh_token
        - expires_in_secs
      properties:
        user_id:
          type: string
          format: uuid
        username:
          type: string
        email:
          type: string
        access_token:
          type: string
        refresh_token:
          type: string
        expires_in_secs:
          type: integer

    RefreshTokenRequest:
      type: object
      required:
        - refresh_token
