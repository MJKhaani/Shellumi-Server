name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  validate-tag:
    name: Validate Tag & Version Invariants
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      is_prerelease: ${{ steps.version.outputs.is_prerelease }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Tag Format
        id: version
        run: |
          TAG="${{ github.ref_name }}"
          echo "Validating tag: $TAG"

          # Strict SemVer validation: vMAJOR.MINOR.PATCH[-PRERELEASE]
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "ERROR: Tag '$TAG' does not match strict SemVer format (vX.Y.Z[-prerelease])"
            exit 1
          fi

          VERSION="${TAG#v}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

          # Check if tag is pre-release
          if [[ "$VERSION" =~ - ]]; then
            echo "is_prerelease=true" >> $GITHUB_OUTPUT
          else
            echo "is_prerelease=false" >> $GITHUB_OUTPUT
          fi

          # Verify Cargo.toml package version matches tag version (base version)
          CARGO_VERSION=$(grep -m 1 '^version = ' Cargo.toml | cut -d '"' -f 2)
          echo "Cargo workspace version: $CARGO_VERSION"
          if [[ "$CARGO_VERSION" != "$VERSION" && "$CARGO_VERSION" != "${VERSION%%-*}" ]]; then
            echo "ERROR: Cargo.toml version ($CARGO_VERSION) does not match tag version ($VERSION)"
            exit 1
          fi

  build-binaries:
    name: Build Native Binary (${{ matrix.target }})
    needs: validate-tag
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            arch: x86_64
          - target: aarch64-unknown-linux-gnu
            arch: aarch64
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compilation tools
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build release binary
        run: |
          if [ "${{ matrix.target }}" = "aarch64-unknown-linux-gnu" ]; then
            export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc
          fi
          cargo build --release --locked --target ${{ matrix.target }} -p shellumi-server

      - name: Package Binary Archive
        run: |
          VERSION="${{ needs.validate-tag.outputs.version }}"
          ARCHIVE_DIR="shellumi-server-v${VERSION}-${{ matrix.target }}"
          mkdir -p "$ARCHIVE_DIR"

          cp "target/${{ matrix.target }}/release/shellumi-server" "$ARCHIVE_DIR/"
          cp LICENSE README.md "$ARCHIVE_DIR/"
          cp deploy/.env.example "$ARCHIVE_DIR/config.example.env"
          cp -r migrations "$ARCHIVE_DIR/"

          tar -czvf "${ARCHIVE_DIR}.tar.gz" "$ARCHIVE_DIR"
          sha256sum "${ARCHIVE_DIR}.tar.gz" > "${ARCHIVE_DIR}.tar.gz.sha256"

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.target }}
          path: |
            *.tar.gz
            *.tar.gz.sha256

  build-and-push-docker:
    name: Build & Push Multi-Arch Container Image
    needs: validate-tag
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern=v{{version}}
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ needs.validate-tag.outputs.is_prerelease == 'false' }}

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  publish-release:
    name: Publish GitHub Release
    needs: [validate-tag, build-binaries, build-and-push-docker]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all binary artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate Consolidated SHA256SUMS.txt
        working-directory: release-assets
        run: |
          sha256sum *.tar.gz > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Shellumi Server ${{ github.ref_name }}
          prerelease: ${{ needs.validate-tag.outputs.is_prerelease == 'true' }}
          files: |
            release-assets/*.tar.gz
            release-assets/SHA256SUMS.txt
          generate_release_notes: true
