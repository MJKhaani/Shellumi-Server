name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  check:
    name: Code Quality & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cargo Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Check Formatting
        run: cargo fmt --all -- --check

      - name: Strict Clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

      - name: Run Tests
        run: cargo test --locked --workspace --all-features

      - name: Doc Tests
        run: cargo test --locked --doc --workspace

      - name: Build Workspace
        run: cargo build --locked --workspace --all-features

  container-smoke:
    name: Container Build Smoke Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Container Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: shellumi-server:test

  postgres-acceptance:
    name: PostgreSQL acceptance
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: shellumi_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d shellumi_test"
          --health-interval 2s --health-timeout 2s --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Run PostgreSQL acceptance
        env:
          SHELLUMI_REQUIRE_POSTGRES: "1"
          SHELLUMI_TEST_DATABASE_URL: postgres://postgres:testpassword@localhost:5432/shellumi_test
        run: cargo test --locked -p shellumi-server-store --test postgres_acceptance
      - name: Run PostgreSQL WebSocket acceptance
        env:
          SHELLUMI_REQUIRE_POSTGRES: "1"
          SHELLUMI_TEST_DATABASE_URL: postgres://postgres:testpassword@localhost:5432/shellumi_test
        run: cargo test --locked -p shellumi-server --test postgres_websocket
