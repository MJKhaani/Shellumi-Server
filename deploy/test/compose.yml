# Ephemeral PostgreSQL container for CI and local database integration testing
services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "127.0.0.1:5433:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: testpassword
      POSTGRES_DB: shellumi_test
    # Fast in-memory storage for ephemeral test database
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d shellumi_test"]
      interval: 2s
      timeout: 2s
      retries: 10
